# Milo 主题默认配置
uiux:
  slogan: ''
  primary_color: null
  link_color: null
  bg_color: null
img:
  avatar: ''
head:
  favicon:
    ico: ''
footer:
  custom_text: null
  copyright_since: 0
search:
  enable: true
toc:
  enable: true
comment:
  disqus:
    shortname: ''

# 分享图：完整 URL 或站内路径，回退到头像及内置 PNG。
seo:
  image: ''
# 内置 Atom 订阅；站点已有 Feed 生成器优先。
feed:
  enable: true
  limit: 20

# 可选文章灯箱；文章可用 lightbox: false 单独禁用。
reading:
  lightbox: false

# 双栏布局吸附最近文章与分类区域。
sidebar:
  sticky: true
